<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsPro X | Maintenance</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-alt-spx text-center">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                
                <div class="mb-5 text-accent-spx display-1 animate-float">
                    <i class="fa-solid fa-person-digging"></i>
                </div>
                
                <h2 class="display-5 fw-bold mb-3">System Maintenance</h2>
                <p class="text-muted-spx lead mb-5 mx-auto" style="max-width: 500px;">We are currently upgrading our platform to serve you better. We'll be back online in approximately 2 hours.</p>
                
                <div class="progress mx-auto mb-5" style="height: 10px; max-width: 400px;">
                    <div class="progress-bar bg-accent-spx progress-bar-striped progress-bar-animated" role="progressbar" style="width: 75%"></div>
                </div>

                <a href="javascript:location.reload()" class="btn btn-primary-spx btn-spx"><i class="fa-solid fa-rotate-right me-2"></i>Refresh Page</a>
            </div>
        </div>
    </div>

</body>
</html>
