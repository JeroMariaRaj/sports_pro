<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SportsPro | Forgot Password</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-alt-spx">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-xl-4 col-lg-5 col-md-7">
                <div class="spx-card border-0 shadow-lg p-5">
                    <div class="text-center mb-5">
                        <div class="bg-accent-spx bg-opacity-10 text-accent-spx rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4" style="width: 60px; height: 60px;">
                            <i class="fa-solid fa-key fs-4"></i>
                        </div>
                        <h4 class="fw-bold mb-2">Reset Password</h4>
                        <p class="text-muted-spx small">Enter your email and we'll send you instructions to reset your password.</p>
                    </div>

                    <form onsubmit="event.preventDefault(); window.showToast('Reset instructions sent to your email!');">
                        <div class="mb-4">
                            <label class="form-label text-muted-spx small fw-bold">Email address</label>
                            <input type="email" class="form-control-spx w-100 border-0 bg-alt-spx" placeholder="Enter your email" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary-spx btn-spx w-100 mb-4">Send Reset Link</button>
                        
                        <div class="text-center">
                            <a href="login.html" class="text-muted-spx small text-decoration-none hover-primary"><i class="fa-solid fa-arrow-left me-2"></i>Back to log in</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
