<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - SportsPro X</title>
  <link rel="icon" href="assets/images/site-icon.jpeg">
  <script src="tailwind.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="navbar.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap"
    rel="stylesheet">
  <style>
    /* THEME TOGGLE */
    :root {
      --home-bg: #ffffff;
      --text-color: #111111;
    }

    [data-theme="dark"] {
      --home-bg: #000000;
      --text-color: #ffffff;
    }

    body {
      background-color: var(--home-bg) !important;
      color: var(--text-color);
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    [data-theme="dark"] section,
    [data-theme="dark"] .card,
    [data-theme="dark"] .bg-white,
    [data-theme="dark"] .bg-\[\#FDFBF9\],
    [data-theme="dark"] .bg-\[\#F9F7F5\],
    [data-theme="dark"] .bg-\[\#EFEBE9\] {
      background-color: #000000 !important;
      border-color: #333333 !important;
    }

    [data-theme="dark"] p,
    [data-theme="dark"] h1,
    [data-theme="dark"] h2,
    [data-theme="dark"] h3,
    [data-theme="dark"] h4,
    [data-theme="dark"] h5,
    [data-theme="dark"] h6,
    [data-theme="dark"] span {
      color: #ffffff !important;
    }

    /* Keep the quantity picker legible and interactive in dark mode. */
    [data-theme="dark"] #quantityControl,
    html.dark #quantityControl {
      background: #1c1513 !important;
      border-color: #6d5148 !important;
    }

    [data-theme="dark"] #quantityControl .quantity-button,
    html.dark #quantityControl .quantity-button {
      min-width: 48px;
      color: #ffffff !important;
      background: #251714 !important;
      border: 0;
      cursor: pointer;
    }

    [data-theme="dark"] #quantityControl .quantity-button:hover,
    html.dark #quantityControl .quantity-button:hover {
      background: #8d6e63 !important;
      color: #ffffff !important;
    }

    [data-theme="dark"] #quantityControl .quantity-button:active,
    html.dark #quantityControl .quantity-button:active {
      background: #5d4037 !important;
    }

    [data-theme="dark"] #quantityControl .quantity-button i,
    html.dark #quantityControl .quantity-button i {
      color: inherit !important;
    }

    [data-theme="dark"] #quantityControl .quantity-input,
    html.dark #quantityControl .quantity-input {
      background: #2a1d19 !important;
      color: #ffffff !important;
      border-color: #6d5148 !important;
    }

    #quantityControl .quantity-input::-webkit-inner-spin-button,
    #quantityControl .quantity-input::-webkit-outer-spin-button {
      appearance: none;
      margin: 0;
    }
  </style>
</head>

<body class="font-sans overflow-x-hidden">
  <div id="navbar"></div>

  <section class="py-24 bg-white mt-16 min-h-[70vh]">
    <div class="max-w-7xl mx-auto px-6" id="product-container">
      <div class="text-center py-12">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-[#3E2723]"></div>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="navbar.js"></script>
  <script src="footer.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');
      const container = document.getElementById('product-container');

      if (!productId || !window.db) {
        container.innerHTML = '<div class="text-center py-12 text-[#3E2723] font-bold">Product not found.</div>';
        return;
      }

      const product = window.db.products.find(p => p.id === productId);
      if (!product) {
        container.innerHTML = '<div class="text-center py-12 text-[#3E2723] font-bold">Product not found.</div>';
        return;
      }

      const priceHtml = product.discountPrice 
        ? `<span class="line-through text-[#8D6E63] text-lg mr-3">$${product.price}</span><span class="text-[#3E2723] font-bold text-3xl">$${product.discountPrice}</span>`
        : `<span class="text-[#3E2723] font-bold text-3xl">$${product.price}</span>`;

      container.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
          <!-- Image -->
          <div class="bg-[#FDFBF9] rounded-[2rem] border-4 border-[#EFEBE9] p-8 aspect-square flex items-center justify-center relative shadow-lg">
            ${product.discountPrice ? `<span class="absolute top-6 left-6 badge bg-red-600 text-white text-xs px-3 py-1.5 rounded-full font-bold shadow-md">SALE</span>` : ''}
            <img src="${product.image}" alt="${product.name}" class="w-full h-full object-contain hover:scale-105 transition-transform duration-500">
          </div>
          
          <!-- Details -->
          <div class="space-y-6">
            <nav class="flex text-xs font-bold text-[#8D6E63] uppercase tracking-wider mb-2">
              <a href="index.html" class="hover:text-[#3E2723]">Home</a>
              <span class="mx-2">/</span>
              <a href="shop.html?cat=${product.category}" class="hover:text-[#3E2723]">${product.category}</a>
            </nav>
            <h1 class="text-4xl md:text-5xl font-bold text-[#3E2723] leading-tight">${product.name}</h1>
            <div class="flex items-center gap-4 border-b border-[#EFEBE9] pb-6">
              <div class="flex text-amber-500 text-sm">
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i>
                <i class="bi bi-star-half"></i>
              </div>
              <span class="text-sm font-semibold text-[#5D4037]">${product.rating} (${product.reviews} reviews)</span>
            </div>
            
            <div class="pt-2">
              ${priceHtml}
            </div>
            
            <p class="text-[#5D4037] leading-relaxed text-base">
              ${product.description}
            </p>
            
            <div class="bg-[#FDFBF9] border border-[#EFEBE9] rounded-2xl p-6 mt-6">
              <h4 class="font-bold text-[#3E2723] mb-4 text-sm uppercase tracking-wider">Specifications</h4>
              <ul class="space-y-3 text-sm text-[#5D4037]">
                ${Object.entries(product.specifications).map(([key, val]) => `
                  <li class="flex justify-between border-b border-[#EFEBE9] pb-2 last:border-0 last:pb-0">
                    <span class="font-semibold capitalize">${key}</span>
                    <span>${val}</span>
                  </li>
                `).join('')}
              </ul>
            </div>
            
            <div class="flex items-center gap-4 pt-6">
              <div id="quantityControl" class="flex items-center overflow-hidden rounded-xl border-2 border-[#EFEBE9] bg-white shadow-sm">
                <button type="button" aria-label="Decrease quantity" onclick="document.getElementById('qty').value = Math.max(1, (parseInt(document.getElementById('qty').value) || 1) - 1)" class="quantity-button px-4 py-3 font-bold text-[#3E2723] transition-colors hover:bg-[#FDFBF9] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-[#8D6E63]"><i class="bi bi-dash-lg"></i></button>
                <input type="number" id="qty" value="1" min="1" aria-label="Quantity" oninput="this.value = Math.max(1, parseInt(this.value) || 1)" class="quantity-input w-12 border-x-2 border-[#EFEBE9] bg-white py-3 text-center font-bold text-[#3E2723] focus:outline-none">
                <button type="button" aria-label="Increase quantity" onclick="document.getElementById('qty').value = (parseInt(document.getElementById('qty').value) || 1) + 1" class="quantity-button px-4 py-3 font-bold text-[#3E2723] transition-colors hover:bg-[#FDFBF9] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-[#8D6E63]"><i class="bi bi-plus-lg"></i></button>
              </div>
              <button onclick="window.store.addToCart('${product.id}', parseInt(document.getElementById('qty').value)); if(window.showToast) window.showToast('Added to cart');" class="flex-1 bg-[#3E2723] hover:bg-[#8D6E63] text-white py-4 rounded-xl font-bold uppercase tracking-wider transition-colors shadow-lg">
                Add to Cart
              </button>
            </div>
          </div>
        </div>
      `;

      // The navigation supports both data-theme and the Tailwind dark class.
      // Apply explicit quantity-picker colors for either mode, including after a theme switch.
      const syncQuantityTheme = () => {
        const isDark = document.documentElement.dataset.theme === 'dark' || document.documentElement.classList.contains('dark');
        const control = document.getElementById('quantityControl');
        const input = document.getElementById('qty');
        const buttons = control?.querySelectorAll('.quantity-button') || [];
        if (!control || !input) return;
        control.style.backgroundColor = isDark ? '#1c1513' : '';
        control.style.borderColor = isDark ? '#6d5148' : '';
        input.style.backgroundColor = isDark ? '#2a1d19' : '';
        input.style.color = isDark ? '#ffffff' : '';
        input.style.borderColor = isDark ? '#6d5148' : '';
        buttons.forEach(button => {
          button.style.backgroundColor = isDark ? '#251714' : '';
          button.style.color = isDark ? '#ffffff' : '';
          button.onmouseenter = () => { if (isDark) button.style.backgroundColor = '#8d6e63'; };
          button.onmouseleave = () => { if (isDark) button.style.backgroundColor = '#251714'; };
        });
      };
      syncQuantityTheme();
      new MutationObserver(syncQuantityTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['class', 'data-theme'] });
    });
  </script>
</body>
</html>
